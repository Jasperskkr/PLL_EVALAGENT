[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pll-agent"
version = "0.1.0"
description = "Deterministic PLL behavioral allocation and verification tools"
requires-python = ">=3.13,<3.14"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["v1*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
