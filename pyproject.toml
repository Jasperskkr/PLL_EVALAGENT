[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pll-behavioral-allocation"
version = "0.1.0"
description = "Physics-informed joint PLL BlockSpec allocation with real behavioral verification"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]
integration = ["numpy>=2.0,<3", "scipy>=1.14,<2"]

[project.scripts]
pll-allocation = "pll_allocation.cli:main"

[tool.setuptools.packages.find]
include = ["pll_allocation*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.package-data]
"pll_allocation.verification" = ["*.cpp", "*.cmd"]

[tool.setuptools.data-files]
"share/pll-allocation/configs" = ["configs/pipeline.json"]
"share/pll-allocation/configs/agent" = ["configs/agent/deterministic.json", "configs/agent/llm_physics.json", "configs/agent/region_planning.json", "configs/agent/region_search.json"]
"share/pll-allocation/configs/baselines" = ["configs/baselines/joint_nominal.json", "configs/baselines/joint_tight.json", "configs/baselines/m1_allocation.json", "configs/baselines/noise_ideal.json", "configs/baselines/noise_nonideal.json"]
"share/pll-allocation/configs/model" = ["configs/model/block_space.json", "configs/model/equations.json", "configs/model/m1_experiment.json", "configs/model/reference_system_spec.json"]
"share/pll-allocation/configs/problems" = ["configs/problems/infeasible_pm.json", "configs/problems/nominal.json", "configs/problems/tight.json"]
"share/pll-allocation/configs/provenance" = ["configs/provenance/allocation_sources.json", "configs/provenance/config_paths.json", "configs/provenance/physics_registry.json", "configs/provenance/verification_profiles.json"]
"share/pll-allocation/configs/providers" = ["configs/providers/messages.json", "configs/providers/messages_interactive.json"]
"share/pll-allocation/configs/verification" = ["configs/verification/feedback.json", "configs/verification/m2_protocol.json", "configs/verification/noise_protocol.json", "configs/verification/phase_step_protocol.json", "configs/verification/return_ratio_protocol.json", "configs/verification/verify_only.json"]
"share/pll-allocation/configs/verification/profiles" = ["configs/verification/profiles/noise_all.json", "configs/verification/profiles/noise_cp.json", "configs/verification/profiles/noise_protocol.json", "configs/verification/profiles/noise_reference.json", "configs/verification/profiles/noise_resistor.json", "configs/verification/profiles/noise_vco.json", "configs/verification/profiles/noise_zero.json", "configs/verification/profiles/nonideal_K2_minus.json", "configs/verification/profiles/nonideal_K2_plus.json", "configs/verification/profiles/nonideal_combined.json", "configs/verification/profiles/nonideal_compliance.json", "configs/verification/profiles/nonideal_leak_minus.json", "configs/verification/profiles/nonideal_leak_plus.json", "configs/verification/profiles/nonideal_mismatch_minus.json", "configs/verification/profiles/nonideal_mismatch_plus.json", "configs/verification/profiles/nonideal_reset.json", "configs/verification/profiles/nonideal_zero.json"]
